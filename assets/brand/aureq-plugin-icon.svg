<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Cosmic Navy) -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0B0F12" />
      <stop offset="100%" stop-color="#0D1F35" />
    </radialGradient>
    
    <!-- Node Gradient (Cyan to White) -->
    <radialGradient id="node-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </radialGradient>

    <!-- Node Glow -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.6)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>

    <!-- Aurora Glow -->
    <radialGradient id="aurora-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.25)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>

    <!-- Drop Shadow for the curve to give glass depth -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Shape -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg-grad)" />

  <!-- Aurora / Nebula at the top -->
  <ellipse cx="512" cy="256" rx="400" ry="250" fill="url(#aurora-grad)" />

  <!-- Parametric EQ Curve -->
  <path d="M 128,768 C 256,768 384,640 450,450 C 512,256 512,256 574,450 C 640,640 768,768 896,768" 
        fill="none" 
        stroke="#22D3EE" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glass-shadow)" />

  <!-- Node Glow -->
  <circle cx="512" cy="256" r="160" fill="url(#node-glow)" />

  <!-- Node Core -->
  <circle cx="512" cy="256" r="56" fill="url(#node-grad)" filter="url(#glass-shadow)" />
  
</svg>
