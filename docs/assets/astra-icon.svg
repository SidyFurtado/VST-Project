<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Deep Cosmic Navy) -->
    <radialGradient id="bg-grad-astra" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#08080E" />
      <stop offset="100%" stop-color="#0B1628" />
    </radialGradient>
    
    <!-- Nucleus Glow -->
    <radialGradient id="nucleus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
      <stop offset="40%" stop-color="rgba(34, 211, 238, 0.4)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>

    <!-- Planet Gradient (Cyan to Mint) -->
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Planet Glow -->
    <radialGradient id="planet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(45, 212, 191, 0.6)" />
      <stop offset="100%" stop-color="rgba(45, 212, 191, 0)" />
    </radialGradient>

    <!-- Aurora / Nebula -->
    <radialGradient id="aurora-astra" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(45, 212, 191, 0.15)" />
      <stop offset="100%" stop-color="rgba(45, 212, 191, 0)" />
    </radialGradient>
  </defs>

  <!-- Base App Icon Shape -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg-grad-astra)" />

  <!-- Background Nebula -->
  <ellipse cx="512" cy="512" rx="450" ry="350" fill="url(#aurora-astra)" transform="rotate(-15 512 512)" />

  <!-- Orbital Ring -->
  <g transform="translate(512, 512) rotate(-30)">
    <ellipse cx="0" cy="0" rx="360" ry="140" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="8" />
    
    <!-- Planets (Orbiting Dots) -->
    <!-- Left Planet -->
    <circle cx="-360" cy="0" r="70" fill="url(#planet-glow)" />
    <circle cx="-360" cy="0" r="24" fill="url(#planet-grad)" />
    
    <!-- Right Planet -->
    <circle cx="360" cy="0" r="70" fill="url(#planet-glow)" />
    <circle cx="360" cy="0" r="24" fill="url(#planet-grad)" />

    <!-- Top Planet -->
    <circle cx="0" cy="-140" r="50" fill="url(#planet-glow)" />
    <circle cx="0" cy="-140" r="18" fill="url(#planet-grad)" />

    <!-- Bottom Planet -->
    <circle cx="0" cy="140" r="90" fill="url(#planet-glow)" />
    <circle cx="0" cy="140" r="32" fill="url(#planet-grad)" />
  </g>

  <!-- Central Nucleus Glow -->
  <circle cx="512" cy="512" r="180" fill="url(#nucleus-glow)" />

  <!-- Central Nucleus Core -->
  <circle cx="512" cy="512" r="40" fill="#FFFFFF" />

</svg>
